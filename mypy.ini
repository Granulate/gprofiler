[mypy]
python_version = 3.10
warn_unused_configs = True
exclude = .*venv.*/|deploy/dataflow/|granulate-utils
platform = linux
strict = True
no_implicit_optional = False
disallow_any_generics = False
warn_redundant_casts = True
warn_unused_ignores = True

# typeshed package for this one seems outdated: we get "incorrect" type errors when installing
# types-setuptools
[mypy-setuptools.*]
ignore_missing_imports = True
# pkg_resources is part of setuptools but has separate stubs that are outdated
[mypy-pkg_resources.*]
ignore_missing_imports = True
# pkg_resources API changed in setuptools 81+ and stubs are outdated
[mypy-gprofiler.metadata.py_module_version]
disable_error_code = attr-defined
# no types in package / types- package :(
[mypy-configargparse.*]
ignore_missing_imports = True
# no types in package / types- package :(
[mypy-docker.*]
ignore_missing_imports = True
# no types in package / types- package :(
[mypy-websocket.*]
ignore_missing_imports = True
[mypy-netifaces.*]
ignore_missing_imports = True
[mypy-pythoncom.*]
ignore_missing_imports = True
[mypy-wmi.*]
ignore_missing_imports = True
[mypy-humanfriendly.*]
ignore_missing_imports = True
[mypy-cpuid.*]
ignore_missing_imports = True
